<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e8c">
<title>금옥중 기말 대비</title>
<style>
:root{--pri:#1f4e8c;--pri2:#dfe8f5;--acc:#e0a100;--ink:#1f2328;--mut:#6b7280;--bg:#f6f7f9;--card:#fff;--line:#e3e6eb;--ok:#2e7d4f;--okbg:#e6f4ec;--no:#c0392b;--nobg:#fbeae8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:17px;line-height:1.55}
#app{max-width:720px;margin:0 auto;padding:14px 16px 90px}
h1{font-size:1.35rem;margin:.1em 0}
h2{font-size:1.05rem;margin:1.1em 0 .5em}
.mut{color:var(--mut);font-size:.86rem}
.pbar{display:flex;height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}.pbar i{display:block;height:100%}.pbar i.ok{background:var(--ok)}.pbar i.no{background:var(--no)}
.prt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.ptot .big{font-size:1.9rem;color:var(--ok)}.parea{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.prow{display:block;width:100%;background:none;border:0;padding:6px 0;text-align:left;font:inherit;color:inherit;cursor:pointer}.prow>.prt>span:first-child{font-weight:700}.prow.sub{padding-left:14px;font-size:.92rem}.prow.sub>.prt>span:first-child{font-weight:500}.prow.sub .pbar{height:7px}
.lg{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--line);margin:0 4px 0 8px;vertical-align:-1px}.lg.ok{background:var(--ok)}.lg.no{background:var(--no)}.nbbtn.pg{border-left-color:var(--ok)}
.hw{border-left:4px solid var(--pri)}.hwi{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;text-align:left;font:inherit;color:inherit;cursor:pointer}.hwi .tx{flex:1;display:flex;flex-direction:column}.hwi .tx .mut{font-size:.85rem}.hwi .sc{font-weight:700;color:var(--pri);white-space:nowrap}.hwi.ok{background:var(--okbg);border-color:var(--ok)}.hwi.ok .sc{color:var(--ok)}
.score{text-align:center}.score b{display:block;font-size:56px;line-height:1.1;color:var(--pri);margin:4px 0}.score small{font-size:22px;margin-left:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.top{display:flex;align-items:center;gap:8px}
.top .sp{flex:1}
.icon{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font:inherit;font-size:.9rem;cursor:pointer;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-size:.98rem;cursor:pointer;color:inherit}
.chip.on{border-color:var(--pri);background:var(--pri2);color:var(--pri);font-weight:700}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area{background:#fff;border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.area b{display:block;font-size:1.12rem}
.area span{font-size:.8rem;color:var(--mut)}
.area.off{opacity:.45;cursor:default}
.types{display:grid;gap:8px}
.type{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.type b{flex:1;font-weight:600;font-size:.98rem}
.type .n{font-size:.8rem;color:var(--mut);white-space:nowrap}
.type .src{display:block;font-weight:400;font-size:.75rem;color:var(--mut)}
.btn{display:inline-block;border:none;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.soft{background:#eef0f3;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{flex:1;border:none;background:#fff;padding:9px 4px;font:inherit;font-size:.92rem;cursor:pointer;color:inherit}
.seg button.on{background:var(--pri2);color:var(--pri);font-weight:700}
.bar{height:6px;background:#e6e9ee;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--mut);margin:0 4px 4px 0;background:#fff}
.q{font-size:1.12rem;font-weight:600;margin:6px 0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ctx{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.97rem;margin:8px 0;white-space:pre-wrap}
.ctx p{margin:0 0 4px}
.opts{display:grid;gap:8px;margin-top:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;text-align:left;cursor:pointer;color:inherit;word-break:keep-all;overflow-wrap:anywhere}
.opts.two .opt{text-align:center;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt:disabled{cursor:default;color:inherit}
.slot{min-height:58px;border:1.5px dashed #c9cfd8;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:#fff;margin-top:8px}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tile{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font:inherit;cursor:pointer;color:inherit}
.tile.used{visibility:hidden}
.slot .tile{border-color:var(--pri);color:var(--pri)}
.words{line-height:2.3;margin-top:8px}
.w{display:inline-block;border:1px solid transparent;border-radius:8px;padding:0 4px;margin:0 1px;cursor:pointer}
.w:hover{border-color:var(--line)}
.w.sel{background:var(--pri2);border-color:var(--pri)}
.w.ok{background:var(--okbg);border-color:var(--ok)}
.w.no{background:var(--nobg);border-color:var(--no)}
.mark{display:inline-block;min-width:34px;text-align:center;border:1.5px solid var(--line);border-radius:8px;margin:2px 4px;cursor:pointer;font-weight:700;background:#fff;padding:0 4px}
.mark.sel{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.mark.ok{border-color:var(--ok);background:var(--okbg)}
.mark.no{border-color:var(--no);background:var(--nobg)}
.insbox{border:1.5px solid var(--pri);border-radius:10px;padding:10px 12px;background:#fff;margin:8px 0}
.ord{display:grid;gap:8px;margin-top:8px}
.ordi{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ordi .lb{font-weight:800;color:var(--pri);min-width:26px}
.ordi.picked{opacity:.4}
.seq{display:flex;gap:6px;flex-wrap:wrap;min-height:40px;margin-top:8px;align-items:center}
.seq .s{border:1.5px solid var(--pri);color:var(--pri);border-radius:8px;padding:2px 10px;font-weight:800;background:var(--pri2)}
.res{border-radius:12px;padding:12px;margin-top:12px}
.res.ok{background:var(--okbg);border:1px solid #b9dcc6}
.res.no{background:var(--nobg);border:1px solid #f1c3bc}
.res .h{font-weight:800;margin-bottom:4px}
.res .k{color:var(--mut);font-size:.92rem;margin-top:4px}
.hl{background:#fff3c4;border-radius:4px;padding:0 2px;font-weight:700}
.del{color:var(--no);text-decoration:line-through}
.multi{display:grid;gap:8px;margin-top:8px}
.mrow{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mrow span{flex:1}
.ox{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:44px;height:38px;font:inherit;font-weight:800;cursor:pointer;color:inherit}
.ox.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.ox.ok{border-color:var(--ok);background:var(--okbg)}
.ox.no{border-color:var(--no);background:var(--nobg)}
input.ans{width:100%;font:inherit;font-size:1.05rem;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:10px}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem}
.list{margin:0;padding:0;list-style:none}
.list li{border-bottom:1px solid var(--line);padding:8px 0;font-size:.93rem}
.list li:last-child{border:none}
.text p{margin:0 0 8px}
.text .ko{color:var(--mut);font-size:.9rem;display:block}
.text.hideko .ko{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;border:1.5px solid var(--pri);padding:10px 16px;border-radius:12px;font-size:.95rem;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.star{border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:1.15rem;cursor:pointer;min-width:42px;min-height:38px;color:#b8bec8;padding:0 6px;flex:none}
.star.on{color:var(--acc);border-color:var(--acc);background:#fff8e1}
.nbbtn{display:flex;flex-direction:column;gap:2px;width:100%;margin-top:10px;text-align:left;background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.nbli{display:flex;gap:10px;align-items:flex-start}
.nbtx{flex:1;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.tag.miss{color:var(--no);border-color:#f1c3bc}
#gate{max-width:420px;margin:12vh auto 0;padding:0 16px;text-align:center}
#gate input{text-align:center;font-size:1.3rem;letter-spacing:.15em}
.link{background:none;border:none;color:var(--pri);font:inherit;font-size:.88rem;cursor:pointer;padding:4px 2px;text-decoration:underline}
.btn:active,.opt:active,.tile:active,.chip:active,.area:active,.type:active,.ordi:active{transform:scale(.97)}
@media (min-width:700px){.areas{grid-template-columns:repeat(4,1fr)}.q{font-size:1.2rem}}
.gcard{border-left:4px solid #9aa3ad;opacity:.85}.gcard.open{border-left-color:var(--acc);opacity:1}
.btn[disabled]{opacity:.45;cursor:default}
.gtop{display:flex;align-items:center;gap:10px;margin:4px 0 8px;font-size:1rem;white-space:nowrap}.gtop .glife{letter-spacing:-2px}.gtop .icon{margin-left:auto}.gcb{color:#d35400;font-weight:700}
#gfield{position:relative;height:min(56vh,520px);border-radius:16px;overflow:hidden;background:linear-gradient(#0b1530,#1c2f5e 70%,#2a4377);touch-action:manipulation;user-select:none}
.gground{position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(#3b6b3b,#264d26);border-top:3px solid #5a9a4a}
.met{position:absolute;top:0;padding:7px 12px 7px 26px;border-radius:20px;background:#5b4636;color:#fff;font-weight:700;font-size:1.02rem;white-space:nowrap;box-shadow:0 0 0 2px #7d6350 inset;will-change:transform}
.met::before{content:'☄️';position:absolute;left:5px;top:5px;font-size:.95rem}
.met.gold{background:#a87b00;box-shadow:0 0 0 2px #ffd54a inset}
.met.tgt{background:#c2410c;box-shadow:0 0 0 3px #ffe08a,0 0 18px #ffb347;z-index:2}
.met.gold.tgt{background:#d4a000}
.met.pop{animation:gpop .45s forwards}.met.boom{animation:gboom .45s forwards}
.gpts{position:absolute;right:-6px;top:-20px;color:#ffe08a;font-size:1rem}
@keyframes gpop{to{opacity:0;scale:1.6}}@keyframes gboom{to{opacity:0;filter:blur(3px);scale:.6}}
.ghint{position:absolute;left:0;right:0;bottom:44px;text-align:center;color:#fff;font-size:.95rem;transition:opacity .3s;pointer-events:none;padding:0 10px}.ghint.no{color:#ffb4a8;font-weight:700;font-size:1.05rem}.ghint.off{opacity:0}
#gbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;min-height:118px}
.gb{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 8px;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;touch-action:manipulation}
.gb:active{background:var(--pri2)}.gb.bad{background:var(--nobg);border-color:var(--no);color:var(--no)}
.tabs{display:flex;gap:6px;margin:12px 0 4px}
.rank{list-style:none;margin:0;padding:0}.rank li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}.rank li:last-child{border:none}
.rank .rn{width:2em;text-align:center;font-weight:700}.rank .nm{flex:1}.rank li.me{background:var(--pri2);border-radius:8px}
#scv{display:block;width:100%;height:min(60vh,540px);border-radius:16px;touch-action:none;cursor:pointer}
.hwi[disabled]{opacity:.5;cursor:default}.gitem .ck{font-size:1.4rem}
.chip.sm{padding:6px 12px;font-size:.9rem}.tabs+.tabs{margin-top:4px}
.sch{font-size:.72rem;padding:1px 6px;border-radius:6px;background:#fdf1d6;color:#8a5a00;vertical-align:2px}.sch.s2{background:#e3f1ea;color:#1e6b44}
</style>
</head>

// ── 선생님 기록 시트로 보내기 (끝까지 푼 연습만)
function post(p){if(!SHEET)return Promise.resolve();return fetch(SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});}
function report(p){post(p).catch(()=>{S.outbox.push(p);S.outbox=S.outbox.slice(-50);save();});}
function flush(){if(!SHEET||!S.outbox||!S.outbox.length)return;const q=S.outbox;S.outbox=[];save();q.forEach(report);}
function pool(area,k){return IT.filter(x=>S.L.includes(x.L)&&(!area||x.A===area)&&(!k||x.k===k));}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}
let cur=null;

function togL(L){const i=S.L.indexOf(L);if(i>=0){if(S.L.length===1){toast('하나는 골라야 해요');return;}S.L.splice(i,1);}else S.L.push(L);S.L.sort();save();home();}
function copyLog(){const t='[금옥중 기말 대비]\n'+S.log.slice(-10).join('\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('복사했어요. 카톡에 붙여 넣으세요')).catch(()=>prompt('복사해서 보내세요',t));}

// ── 문법(단원별 문법 포인트 2개)·본문(7과는 축제 4개): 그 안에서 여러 유형이 섞여 나옴
const GRP={g:{7:['7과 문법',[['7-1','① 가주어 it · 의미상 주어','It is easy for me to … / It is kind of you to …'],['7-2','② 5형식 call A B','call · name · make · consider + 목적어 + 명사']]],8:['8과 문법',[['8-1','① 현재완료','have + p.p. (완료·계속·경험·결과)'],['8-2','② -thing + 형용사','something cold (to drink)']]]},

function grpPage(a){
  const all=pool(a);
  let h=`<div class="top"><button class="icon" onclick="home()">← 처음</button><div class="sp"></div><span class="mut">${S.L.map(l=>l+'과').join('·')}</span></div>
  <h1>${AREAS[a][0]}</h1>
  <div class="card"><div class="mut" style="margin-bottom:6px">한 번에 풀 문제 수</div><div class="seg">${[20,40,100,0].map(n=>`<button class="${S.n===n?'on':''}" onclick="setN(${n},'${a}')">${n||'전부'}</button>`).join('')}</div>
  <p class="mut" style="margin:8px 0 0">고르기·고치기·배열·O/X 등 여러 유형이 섞여서 나와요.</p>
  ${a==='r'?`<div class="row"><button class="btn soft" onclick="readPage('r')">📖 본문 먼저 읽기</button></div>`:''}</div>`;
  for(const L of S.L){const G=GRP[a][L];if(!G)continue;const inL=all.filter(x=>x.L===L);if(!inL.length)continue;
    h+=`<h2>${esc(G[0])}</h2><div class="types">`;
    for(const [g,name,sub] of G[1]){const n=inL.filter(x=>x.grp===g).length;if(n)h+=`<button class="type" onclick="startGrp('${a}',${L},'${g}')"><b>${esc(name)}<span class="src">${esc(sub)}</span></b><span class="n">${n}문제 ›</span></button>`;}
    h+=`<button class="type" onclick="startGrp('${a}',${L},'')"><b>🎲 ${L}과 ${a==='g'?'문법':'본문'} 전체 섞기<span class="src">${G[1].length?'위 '+G[1].length+'개를 모두 섞어서':'본문 전체에서 여러 유형'}</span></b><span class="n">${inL.length}문제 ›</span></button></div>`;}
  const ks={};for(const x of all){(ks[x.k]=ks[x.k]||{ty:x.ty,n:0});ks[x.k].n++;}
  h+=`<details class="card" style="margin-top:14px"><summary class="mut">유형 하나만 골라 풀기</summary><div class="types" style="margin-top:8px">${Object.entries(ks).map(([k,o])=>`<button class="type" onclick="start('${a}','${k}')"><b>${esc(o.ty)}</b><span class="n">${o.n}문제 ›</span></button>`).join('')}</div></details>`;

function startGrp(a,L,g){const list=IT.filter(x=>x.A===a&&x.L===L&&(!g||x.grp===g));if(!list.length){toast('문제가 없어요');return;}
  const G=GRP[a][L],nm=g?G[1].find(z=>z[0]===g)[1].replace(/^[①-⑨]\s*/,''):L+'과 '+(a==='g'?'문법':'본문')+' 섞기';run(drawMix(list,S.n),nm);}
// ── 문제 뽑기
// 1) 아직 안 푼 문제(+ 틀린 문제·별표 문제)를 먼저 무작위로 고름
// 2) 그게 다 떨어진 뒤에만 이미 푼 문제를 '오래전에 푼 것'부터 다시 냄 → 한 바퀴 다 돌기 전엔 같은 문제가 안 나옴
// 3) 순서는 같은 형태(배열·O/X·고르기…)가 연달아 나오지 않게 섞음
function drawMix(list,n){
  const max=n?Math.min(n,list.length):list.length;
  const fresh=list.filter(x=>!S.seen[x.id]||S.wrong[x.id]||S.star[x.id]),old=list.filter(x=>S.seen[x.id]&&!S.wrong[x.id]&&!S.star[x.id]);
  // 유형 비율대로 고르게 뽑음(작은 유형을 먼저 다 써 버리면 한 바퀴 끝에 한 유형만 남으므로)
  const out=shuf(fresh).slice(0,max);
  if(out.length<max){const o=shuf(old).sort((a,b)=>S.seen[a.id]-S.seen[b.id]);out.push(...o.slice(0,max-out.length));}
  return spread(out.map(pickAlt));
}
const draw=drawMix;
function spread(arr){const by={};for(const x of arr)(by[x.t]=by[x.t]||[]).push(x);const out=[];let last=null;
  while(out.length<arr.length){const ks=Object.keys(by).filter(k=>by[k].length);let c=ks.filter(k=>k!==last);if(!c.length)c=ks;
    const left=arr.length-out.length;let pick=c.find(k=>by[k].length*2>left+1&&k!==last);
    if(!pick){let tot=c.reduce((s,k)=>s+by[k].length,0),r=Math.random()*tot;pick=c[c.length-1];for(const k of c){r-=by[k].length;if(r<0){pick=k;break;}}}
    const lk=out.length?out[out.length-1].k:null;let j=by[pick].findIndex(x=>x.k!==lk);if(j<0)j=0;out.push(by[pick].splice(j,1)[0]);last=pick;}
  return out;}
function start(a,k){const list=pool(a,k);if(!list.length){toast('문제가 없어요');return;}const sch=k&&list.every(x=>x.src.startsWith('학교학습지'));run(drawMix(list,sch?0:S.n),(k?list[0].ty:AREAS[a][0]+' 섞기'));}
function mixAll(){run(draw(pool(),S.n||20),'전체 섞기');}
// ── 오답 노트 (틀린 문제 / 별표)
function nbIds(tab,area){const src=tab==='s'?S.star:S.wrong;return Object.keys(src).filter(id=>IDX[id]&&S.L.includes(IDX[id].L)&&(!area||IDX[id].A===area));}
function toggleStar(id,el){if(S.star[id])delete S.star[id];else S.star[id]=1;save();if(el){el.classList.toggle('on',!!S.star[id]);el.textContent=S.star[id]?'★':'☆';}if(!cur)notePage();else toast(S.star[id]?'⭐ 별표! 오답 노트에서 다시 볼 수 있어요':'별표를 뺐어요');}
function notePage(){
  cur=null;const tab=S.nbTab||'w',area=S.nbA||'';
  const ids=nbIds(tab,area).sort((a,b)=>(S.miss[b]||0)-(S.miss[a]||0)||a-b);
  const cnt=a=>nbIds(tab,a).length;
  let h=`<div class="top"><button class="icon" onclick="home()">← 처음</button><div class="sp"></div><span class="mut">${S.L.map(l=>l+'과').join('·')}</span></div><h1>📒 오답 노트</h1>
  <div class="seg" style="margin:8px 0"><button class="${tab==='w'?'on':''}" onclick="S.nbTab='w';save();notePage()">❌ 틀린 문제 (${nbIds('w').length})</button><button class="${tab==='s'?'on':''}" onclick="S.nbTab='s';save();notePage()">⭐ 별표 문제 (${nbIds('s').length})</button></div>
  <p class="mut" style="margin:4px 0 8px">${tab==='w'?'틀린 문제가 모여요. 다시 풀어서 <b>두 번 맞히면</b> 저절로 빠져요.':'문제 화면 오른쪽 위 ☆를 누르면 여기에 모여요. 맞혀도 별표를 직접 뺄 때까지 남아 있어요.'}</p>
  <div class="chips">${[['','전체'],...Object.entries(AREAS).map(([k,v])=>[k,v[0]])].map(([k,n])=>`<button class="chip ${area===k?'on':''}" onclick="S.nbA='${k}';save();notePage()">${n} ${cnt(k)}</button>`).join('')}</div>`;
  if(!ids.length)h+=`<div class="card">${tab==='w'?'틀린 문제가 없어요 👍':'별표 친 문제가 없어요. 중요한 문제에 ☆를 눌러 두세요.'}</div>`;
  else{
    h+=`<div class="row"><button class="btn" onclick="nbRun()">🔁 ${ids.length>(S.n||999)?S.n+'문제씩 ':''}다시 풀기 (${ids.length})</button></div>
    <div class="card"><ul class="list">${ids.map(id=>{const x=IDX[id];return `<li class="nbli"><button class="star ${S.star[id]?'on':''}" onclick="toggleStar('${id}',this)">${S.star[id]?'★':'☆'}</button><div class="nbtx" onclick="run([IDX['${id}']],'한 문제 복습')"><span class="tag">${x.L}과</span><span class="tag">${AREAS[x.A][0]}</span><span class="tag">${esc(x.ty)}</span>${S.miss[id]?`<span class="tag miss">${S.miss[id]}번 틀림</span>`:''}<br>${esc(brief(x))}</div></li>`;}).join('')}</ul></div>
    <button class="link" onclick="nbClear()">${tab==='w'?'틀린 문제 목록':'별표'} 모두 지우기${area?' ('+AREAS[area][0]+')':''}</button>`;}
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function nbRun(){const ids=nbIds(S.nbTab,S.nbA);run(shuf(ids.map(id=>IDX[id])).slice(0,S.n||999),(S.nbTab==='s'?'⭐ 별표':'❌ 오답')+' 복습');}
// ── 내 학습 현황: 익힘 = 한 번 이상 풀었고 지금 오답 노트(틀린 문제)에 없는 문제
function pstat(list){let m=0,w=0;for(const x of list){if(S.wrong[x.id])w++;else if(S.seen[x.id])m++;}const n=list.length;return {n,m,w,p:n?Math.round(m/n*100):0};}
function pbar(s){return `<div class="pbar"><i class="ok" style="width:${s.n?s.m/s.n*100:0}%"></i><i class="no" style="width:${s.n?s.w/s.n*100:0}%"></i></div>`;}
function prow(label,list,go,sub){const s=pstat(list);if(!s.n)return '';return `<button class="prow${sub?' sub':''}" onclick="${go}"><div class="prt"><span>${esc(label)}</span><span><b>${s.p}%</b> <span class="mut">${s.m}/${s.n}</span></span></div>${pbar(s)}</button>`;}
function progPage(){
  cur=null;
  let h=`<div class="top"><button class="icon" onclick="home()">← 처음</button><div class="sp"></div></div><h1>📊 내 학습 현황</h1>
  <div class="card mut" style="font-size:.9rem"><span class="lg ok"></span>익힘 (맞혔고 오답 노트에 없음) <span class="lg no"></span>복습 중 (틀린 문제) <span class="lg"></span>아직 안 푼 문제<br>막대를 누르면 그 부분을 바로 연습해요. 안 푼 문제가 먼저 나와요.</div>`;
  for(const L of [7,8]){const all=IT.filter(x=>x.L===L);if(!all.length)continue;const s=pstat(all);
    h+=`<div class="card ptot"><div class="prt"><b style="font-size:1.25rem">${L}과 ${L===7?'Let’s Enjoy Festivals':'Time Travel'}</b><span><b class="big">${s.p}%</b></span></div>${pbar(s)}<div class="mut" style="margin-top:4px">익힘 ${s.m} · 복습 중 ${s.w} · 안 푼 문제 ${s.n-s.m-s.w} (전체 ${s.n})</div>`;
    for(const a of ['v','g','r','d']){const la=all.filter(x=>x.A===a);if(!la.length)continue;
      h+=`<div class="parea">`+prow(AREAS[a][0],la,`goProg('${a}',${L},'')`);
      if(a==='v'){h+=prow('학교학습지',la.filter(x=>x.src.startsWith('학교학습지')),`goProg('v',${L},'sch')`,1)+prow('WORD TEST',la.filter(x=>!x.src.startsWith('학교학습지')),`goProg('v',${L},'etc')`,1);}
      else if(GRP[a]&&GRP[a][L])for(const [g,name] of GRP[a][L][1])h+=prow(name,la.filter(x=>x.grp===g),`goProg('${a}',${L},'${g}')`,1);
      h+=`</div>`;}
    h+=`</div>`;}
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function goProg(a,L,g){let list=IT.filter(x=>x.A===a&&x.L===L),nm=L+'과 '+AREAS[a][0];
  if(g==='sch'){list=list.filter(x=>x.src.startsWith('학교학습지'));nm+=' · 학교학습지';}else if(g==='etc'){list=list.filter(x=>!x.src.startsWith('학교학습지'));nm+=' · WORD TEST';}

const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function hwAreas(){return Object.keys(AREAS).filter(a=>pool(a).length);}

function hwMark(c,score){const n=c.list.length;if(!n)return;const by={};c.list.forEach(x=>by[x.A]=(by[x.A]||0)+1);

const TYN={arr:'영작 배열',tf:'어법 O/X',fix:'틀린 곳 고치기',mc:'어법 고르기'};
function pickAlt(x){if(!x.alt||x._v)return x;const v=x.alt[Math.random()*x.alt.length|0];return {id:x.id,L:x.L,A:x.A,k:x.k,src:x.src,gp:x.gp,grp:x.grp,alt:x.alt,altName:x.altName,ko:x.ko,_v:1,...v,ty:(x.altName?(x.altName.includes('교과서')?'교과서 문장':'문법 문장'):'학교 예문')+' · '+(TYN[v.t]||'')};}
function run(list,name){cur={list:list.map(pickAlt),i:0,ok:0,wrong:[],name};show();}
function head(x){const c=cur;return `<div class="top"><button class="icon" onclick="if(confirm('그만 풀까요?'))home()">✕</button><div class="sp mut">${esc(c.name)} · ${c.i+1}/${c.list.length}</div><span class="mut">✔ ${c.ok}</span><button class="star ${S.star[x.id]?'on':''}" title="중요 문제 별표" onclick="toggleStar('${x.id}',this)">${S.star[x.id]?'★':'☆'}</button></div>
<div class="bar"><i style="width:${(c.i)/c.list.length*100}%"></i></div>
<div><span class="tag">${x.L}과</span><span class="tag">${esc(x.ty)}</span><span class="tag">${esc(x.src)}</span></div>`;}
function show(){
  const c=cur;if(c.i>=c.list.length)return end();
  const x=c.list[c.i];c.done=false;
  let h=head(x)+'<div class="card" id="qc">';
  h+=R[x.t].html(x);
  h+='</div><div id="after"></div>';
  $('#app').innerHTML=h;window.scrollTo(0,0);

}
function judge(x,ok,detail){
  const c=cur;if(c.done)return;c.done=true;
  S.seen[x.id]=(S.tick=(S.tick||1)+1);
  if(ok){c.ok++;if(S.wrong[x.id]){S.wrong[x.id]--;if(S.wrong[x.id]<=0)delete S.wrong[x.id];}}
  else{c.wrong.push(x);S.wrong[x.id]=2;S.miss[x.id]=(S.miss[x.id]||0)+1;}
  save();
  $('#after').innerHTML=`<div class="res ${ok?'ok':'no'}"><div class="h">${ok?'⭕ 정답!':'❌ 아쉬워요'}</div>${detail||''}</div>
  <div class="row"><button class="btn" id="nx" onclick="cur.i++;show()">${c.i+1<c.list.length?'다음 문제 →':'결과 보기'}</button></div>`;
  setTimeout(()=>{const b=$('#nx');b&&b.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}
function end(){
  const c=cur;const n=c.list.length;
  const d=new Date();const stamp=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const score=n?Math.round(c.ok/n*100):0;
  if(n>=3)hwMark(c,score);
  S.log.push(`${stamp} ${c.name} ${c.ok}/${n} (${score}점)`);S.log=S.log.slice(-40);save();
  if(n>=3){const cnt=o=>{const m={};o.forEach(x=>m[x]=(m[x]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+(v>1?'×'+v:'')).join(', ');};
    report({name:S.name||'(이름 없음)',dev:S.dev,range:[...new Set(c.list.map(x=>x.L))].sort().map(l=>l+'과').join('·'),area:[...new Set(c.list.map(x=>AREAS[x.A][0]))].join('·'),practice:c.name,n,ok:c.ok,score,wrong:cnt(c.wrong.map(x=>x.ty))});}
  let h=`<div class="top"><button class="icon" onclick="home()">← 처음</button></div><h1>결과</h1>
  <div class="card score"><div class="mut">${esc(c.name)}</div><b>${score}<small>점</small></b><div class="mut">${score===100?'완벽해요! 🎉':score>=90?'아주 잘했어요 👍':score>=70?'좋아요! 틀린 것만 한 번 더 💪':'틀린 문제는 오답 노트로 꼭 다시 풀어요 📒'}</div></div>
  <div class="stat"><div><b>${c.ok}/${n}</b>맞힌 문제</div><div><b>${n-c.ok}</b>틀린 문제</div></div>`;
  if(c.wrong.length)h+=`<h2>틀린 문제</h2><div class="card"><p class="mut" style="margin:0 0 6px">틀린 문제는 오답 노트에 저장됐어요. 꼭 다시 볼 문제는 ☆를 눌러 두세요.</p><ul class="list">${c.wrong.map(x=>`<li class="nbli"><button class="star ${S.star[x.id]?'on':''}" onclick="toggleStar('${x.id}',this)">${S.star[x.id]?'★':'☆'}</button><div class="nbtx"><span class="tag">${esc(x.ty)}</span>${esc(brief(x))}</div></li>`).join('')}</ul></div>
  <div class="row"><button class="btn" onclick="run(shuf(cur.wrong),'틀린 것 다시')">틀린 것만 다시</button></div>`;
  h+=`<div class="row"><button class="btn ghost" onclick="run(shuf(cur.list),cur.name)">한 번 더</button><button class="btn soft" onclick="notePage()">📒 오답 노트</button><button class="btn soft" onclick="home()">처음으로</button></div>`;
  $('#app').innerHTML=h;window.scrollTo(0,0);
}

R.tf={html(x){let h='';
  if(x.ctx)h+=`<div class="ctx">${x.ctx.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;

  document.querySelectorAll('.opt').forEach(bb=>{if(+bb.dataset.v===x.a)bb.classList.add('ok');else if(bb===b)bb.classList.add('no');bb.disabled=true;});

// 배열
function chunk(en){const w=en.split(/\s+/);if(w.length<=9)return w;const r=[];let i=0;while(i<w.length){const n=(w.length-i===3)?3:2;r.push(w.slice(i,i+n).join(' '));i+=n;}return r;}
R.arr={html(x){
  let rest=x.en,pre='';if(x.pre&&x.en.startsWith(x.pre)){pre=x.pre;rest=x.en.slice(x.pre.length).trim();}
  const ch=x.chunks?x.chunks.slice():chunk(rest);x._ans=ch;const tiles=shuf(ch.concat(x.trap?[x.trap]:[]));x._t=tiles;x._s=[];
  return `${x.ko?`<div class="q">${esc(x.ko)}</div>`:'<div class="q">단어를 바르게 배열하세요</div>'}${x.trap?'<div class="mut">※ 필요 없는 단어 1개가 섞여 있어요</div>':''}
  ${pre?`<div class="ctx">${esc(pre)} …</div>`:''}<div class="slot" id="slot"></div><div class="tiles" id="tiles"></div>
  <div class="row"><button class="btn soft" onclick="arrReset()">다시</button><button class="btn" onclick="arrCheck()">확인</button></div>`;},
 init(x){arrDraw();}};
function arrDraw(){const x=cur.list[cur.i];
  $('#slot').innerHTML=x._s.map((ti,j)=>`<button class="tile" onclick="arrBack(${j})">${esc(x._t[ti])}</button>`).join('');
  $('#tiles').innerHTML=x._t.map((t,i)=>`<button class="tile ${x._s.includes(i)?'used':''}" onclick="arrPut(${i})">${esc(t)}</button>`).join('');}
function arrPut(i){const x=cur.list[cur.i];if(cur.done||x._s.includes(i))return;x._s.push(i);arrDraw();}
function arrBack(j){const x=cur.list[cur.i];if(cur.done)return;x._s.splice(j,1);arrDraw();}
function arrReset(){const x=cur.list[cur.i];if(cur.done)return;x._s=[];arrDraw();}
function arrCheck(){const x=cur.list[cur.i];if(cur.done)return;if(!x._s.length){toast('단어를 눌러 문장을 만드세요');return;}
  const mine=x._s.map(i=>x._t[i]).join(' ');const ok=strip(mine)===strip(x._ans.join(' '));
  judge(x,ok,`<div>${ok?'':'내 답: <span class="del">'+esc(mine)+'</span><br>'}정답: <b>${esc(x.en)}</b></div>${x.trap?`<div class="k">함정 단어: ${esc(x.trap)}</div>`:''}`);}
// 단어 터치 (틀린 곳 / 목적격 보어 / 다른 단어)
const toks=s=>s.split(/\s+/);
const bare=t=>t.replace(/^[“"(]+|[”",.?!:;)]+$/g,'').toLowerCase().replace(/[’]/g,"'");
function lcsDiff(a,b){const A=a.map(bare),B=b.map(bare);const n=A.length,m=B.length;const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const keepA=new Set(),keepB=new Set();let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){keepA.add(i);keepB.add(j);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return {badA:a.map((_,k)=>k).filter(k=>!keepA.has(k)),newB:b.map((_,k)=>k).filter(k=>!keepB.has(k))};}
R.fix={html(x){const a=toks(x.s),b=toks(x.c);const d=lcsDiff(a,b);x._bad=d.badA;x._new=d.newB;
  // 단어가 빠진 경우(삽입 필요) → 앞뒤 단어도 정답 인정
  if(!x._bad.length){const near=new Set();d.newB.forEach(k=>{near.add(Math.max(0,k-1));near.add(Math.min(a.length-1,k));});x._bad=[...near];x._ins=1;}
  return `<div class="mut">어법상 <b>틀린 부분</b>을 터치하세요${x._ins?' (빠진 말이 있는 자리 앞뒤)':''}</div><div class="words q">${a.map((t,i)=>`<span class="w" data-i="${i}">${esc(t)}</span>`).join(' ')}</div>`;},
 init(x){document.querySelectorAll('.w').forEach(w=>w.onclick=()=>{if(cur.done)return;const i=+w.dataset.i;const ok=x._bad.includes(i);
  document.querySelectorAll('.w').forEach(e=>{const k=+e.dataset.i;if(x._bad.includes(k)&&!x._ins)e.classList.add('ok');});if(!ok)w.classList.add('no');
  const b=toks(x.c);judge(x,ok,`고친 문장: ${b.map((t,k)=>x._new.includes(k)?`<span class="hl">${esc(t)}</span>`:esc(t)).join(' ')}${x.note?`<div class="k">💡 ${esc(x.note)}</div>`:''}`);});}};
R.tap={html(x){const a=toks(x.s);const ans=toks(x.ans).map(bare);let st=-1;
  for(let i=0;i+ans.length<=a.length;i++){if(ans.every((t,k)=>bare(a[i+k])===t)){st=i;break;}}
  x._span=st<0?[]:ans.map((_,k)=>st+k);
  return `<div class="mut">${esc(x.q)}</div><div class="words q">${a.map((t,i)=>`<span class="w" data-i="${i}">${esc(t)}</span>`).join(' ')}</div>`;},
 init(x){document.querySelectorAll('.w').forEach(w=>w.onclick=()=>{if(cur.done)return;const i=+w.dataset.i;const ok=x._span.includes(i);
  document.querySelectorAll('.w').forEach(e=>{if(x._span.includes(+e.dataset.i))e.classList.add('ok');});if(!ok)w.classList.add('no');
  judge(x,ok,`정답: <b>${esc(x.ans)}</b>${x.ex?`<div class="k">💡 ${esc(x.ex)}</div>`:''}`);});}};
// 순서
const LB='ABCDEFGHIJ';
R.ord={html(x){x._p=shuf(x.items.map((_,i)=>i));x._seq=[];
  return `${x.title?`<div class="mut">${esc(x.title)}</div>`:''}<div class="q">${esc(x.q||(x.intro?'주어진 글 다음에 이어질 순서로 알맞게 누르세요':'자연스러운 순서대로 누르세요'))}</div>
  ${x.intro?`<div class="ctx">${esc(x.intro)}</div>`:''}<div class="ord">${x._p.map((it,j)=>`<button class="ordi" data-j="${j}"><span class="lb">(${LB[j]})</span><span>${esc(x.items[it])}</span></button>`).join('')}</div>
  <div class="seq" id="seq"><span class="mut">순서: </span></div><div class="row"><button class="btn soft" onclick="ordReset()">다시</button><button class="btn" onclick="ordCheck()">확인</button></div>`;},
 init(x){document.querySelectorAll('.ordi').forEach(b=>b.onclick=()=>{if(cur.done)return;const j=+b.dataset.j;if(x._seq.includes(j))return;x._seq.push(j);b.classList.add('picked');ordSeq();});}};
function ordSeq(){const x=cur.list[cur.i];$('#seq').innerHTML='<span class="mut">순서: </span>'+x._seq.map(j=>`<span class="s">(${LB[j]})</span>`).join('→');}
function ordReset(){const x=cur.list[cur.i];if(cur.done)return;x._seq=[];document.querySelectorAll('.ordi').forEach(b=>b.classList.remove('picked'));ordSeq();}
function ordCheck(){const x=cur.list[cur.i];if(cur.done)return;if(x._seq.length<x.items.length){toast('모두 눌러 주세요');return;}
  const ok=x._seq.every((j,k)=>x._p[j]===k);const right=x.items.map((_,k)=>`(${LB[x._p.indexOf(k)]})`).join(' → ');
  judge(x,ok,`정답: <b>${right}</b>`);}

  <div class="tabs">${Object.entries(T).map(([k,n])=>`<button class="chip sm ${k===tab?'on':''}" onclick="rankPage(null,'${k}')">${n}</button>`).join('')}</div><div id="rk" class="card"><div class="mut">불러오는 중…</div></div>`;
  const show=d=>{const el=$('#rk');if(!el)return;const L=(((d&&d[game])||{})[tab]||[]).slice(0,3),me=maskName(S.name||''),isMe=r=>r.name===me&&r.school===SCHOOL;
    el.innerHTML=L.length?`<ol class="rank">${L.map((r,i)=>`<li class="${isMe(r)?'me':''}"><span class="rn">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="nm">${esc(r.name)}${isMe(r)?' (나)':''} <span class="sch ${r.school==='신서'?'s2':''}">${esc(r.school||'')}</span></span><b>${r.score}</b></li>`).join('')}</ol>`:`<div class="mut">아직 ${T[tab]} 기록이 없어요. 첫 번째 주인공이 되어 보세요!</div>`;
    if(!L.some(isMe))el.innerHTML+=`<div class="mut" style="margin-top:10px;text-align:center">내 최고 기록 <b>${gState().best[game]||0}점</b> · 3등 안에 들면 이름이 올라가요!</div>`;};
  if(rankPage.cache&&Date.now()-rankPage.cache.t<20000){show(rankPage.cache.d);return;}
  if(!SHEET){$('#rk').innerHTML='<div class="mut">랭킹을 볼 수 없어요(기록 시트 미연결).</div>';return;}
  setTimeout(()=>fetch(SHEET+'?rank=1').then(r=>r.json()).then(d=>{rankPage.cache={t:Date.now(),d};show(d);}).catch(()=>{const el=$('#rk');if(el)el.innerHTML='<div class="mut">랭킹을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.</div>';}),Date.now()-(rankPage.at||0)<4000?2500:0);}
function maskName(n){n=String(n).trim();const a=[...n];return a.length<=1?n:a.length===2?a[0]+'*':a[0]+'*'.repeat(a.length-2)+a[a.length-1];}
</script>
